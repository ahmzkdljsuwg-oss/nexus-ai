workflows:
  expo-ios-unsigned:
    name: NEXUS AI Expo iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      vars:
        CI: "1"
        EXPO_NO_TELEMETRY: "1"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install and test
        script: |
          cd mobile
          npm ci
          npm test
      - name: Generate iOS project
        script: |
          cd mobile
          npx expo prebuild --platform ios --no-install
      - name: Install pods
        script: |
          cd mobile/ios
          pod install --repo-update
      - name: Build unsigned IPA
        script: |
          cd mobile/ios
          xcodebuild -workspace NEXUSAI.xcworkspace -scheme NEXUSAI \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/NexusAI.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
          mkdir -p build/Payload
          cp -R build/NexusAI.xcarchive/Products/Applications/NEXUSAI.app build/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/NEXUSAI-unsigned.ipa
    artifacts:
      - mobile/ios/build/NEXUSAI-unsigned.ipa
