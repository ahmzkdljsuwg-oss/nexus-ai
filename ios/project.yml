name: NexusAI
options:
  bundleIdPrefix: ai.nexus
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  NexusAI:
    type: application
    platform: iOS
    sources:
      - path: NexusAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.nexus.app
        PRODUCT_NAME: NexusAI
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: NEXUS AI
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: NEXUS AI uses the microphone only while you hold the voice button, so the assistant can hear your question.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: NEXUS AI converts your recorded voice into text on this device so it can send your question to the NEXUS server.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    scheme:
      testTargets: []
