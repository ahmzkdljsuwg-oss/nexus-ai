name: Build Signed iOS App

on:
  workflow_dispatch:

jobs:
  signed:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Require signing secrets
        run: |
          for name in IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_TEAM_ID IOS_BUNDLE_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; exit 1; fi
          done
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Import certificate and profile
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN=build-signing.keychain-db
          security create-keychain -p "$IOS_CERT_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$IOS_CERT_PASSWORD" "$KEYCHAIN"
          echo "$IOS_CERT_P12_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k "$KEYCHAIN" -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_CERT_PASSWORD" "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive signed app
        working-directory: ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -o pipefail
          xcodebuild -project NexusAI.xcodeproj -scheme NexusAI \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/NexusAI.xcarchive \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            -allowProvisioningUpdates archive

      - name: Export signed IPA
        working-directory: ios
        run: |
          set -euo pipefail
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/NexusAI.xcarchive \
            -exportPath build/export -exportOptionsPlist ExportOptions.plist
          mkdir -p build/signed
          cp build/export/*.ipa build/signed/
          ls -lh build/signed

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: NexusAI-signed-ipa
          path: ios/build/signed/*.ipa
          if-no-files-found: error
