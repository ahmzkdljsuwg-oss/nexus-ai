name: Build Signed iOS App

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "ad-hoc (registered devices) or development"
        type: choice
        options: [ad-hoc, development]
        default: ad-hoc

permissions:
  contents: read

concurrency:
  group: ios-signed
  cancel-in-progress: false

jobs:
  signed:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUNDLE_ID: ai.nexus.app
    steps:
      - uses: actions/checkout@v4

      - name: Require signing secrets
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          for name in IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name. See docs/SIGNING.md"
              exit 1
            fi
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Import certificate and profile
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$IOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          PROFILE_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          PROFILE_APP_ID="${PROFILE_APP_ID#"$PROFILE_TEAM".}"

          echo "Profile: $PROFILE_NAME ($PROFILE_UUID), team $PROFILE_TEAM, app $PROFILE_APP_ID"
          if [ "$PROFILE_APP_ID" != "$BUNDLE_ID" ]; then
            echo "::error::Provisioning profile is for $PROFILE_APP_ID but the app bundle is $BUNDLE_ID"
            exit 1
          fi
          if [ "$PROFILE_TEAM" != "$IOS_TEAM_ID" ]; then
            echo "::error::Provisioning profile team $PROFILE_TEAM does not match IOS_TEAM_ID"
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            echo "::error::The profile has no registered devices. Use an Ad Hoc or Development profile that includes your iPhone UDID."
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive signed app
        working-directory: ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          set -o pipefail
          SIGN_IDENTITY="Apple Distribution"
          if [ "$EXPORT_METHOD" = "development" ]; then SIGN_IDENTITY="Apple Development"; fi
          xcodebuild -project NexusAI.xcodeproj -scheme NexusAI \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/NexusAI.xcarchive \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/signing.keychain-db" \
            archive

      - name: Export signed IPA
        working-directory: ios
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          set -euo pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/NexusAI.xcarchive \
            -exportPath build/export -exportOptionsPlist ExportOptions.plist
          mkdir -p build/signed
          cp build/export/*.ipa build/signed/NexusAI-signed.ipa
          shasum -a 256 build/signed/NexusAI-signed.ipa | tee build/signed/NexusAI-signed.ipa.sha256

      - name: Verify signature
        working-directory: ios
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/verify" && mkdir -p "$RUNNER_TEMP/verify"
          ditto -x -k build/signed/NexusAI-signed.ipa "$RUNNER_TEMP/verify"
          APP="$RUNNER_TEMP/verify/Payload/NexusAI.app"
          test -f "$APP/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          BIN_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          test "$BIN_ID" = "$BUNDLE_ID"
          if codesign -dv "$APP" 2>&1 | grep -q "Signature=adhoc"; then
            echo "::error::IPA is ad-hoc signed by the linker, not by Apple"
            exit 1
          fi
          test -f "$APP/embedded.mobileprovision"
          echo "signature: verified for $BIN_ID"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: NexusAI-signed-ipa
          path: |
            ios/build/signed/NexusAI-signed.ipa
            ios/build/signed/NexusAI-signed.ipa.sha256
          if-no-files-found: error
          retention-days: 30
