name: Expo iOS Screenshots

on:
  push:
    paths:
      - ".github/workflows/expo-ios-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate native iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Build simulator app
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace NEXUSAI.xcworkspace -scheme NEXUSAI \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Launch and capture screenshots
        run: |
          set -euo pipefail
          APP="mobile/ios/build/Build/Products/Release-iphonesimulator/NEXUSAI.app"
          test -d "$APP"
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          test -n "$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" ai.nexus.app
          sleep 1
          mkdir -p shots
          xcrun simctl io "$DEVICE" screenshot shots/01-launch.png
          sleep 4
          xcrun simctl io "$DEVICE" screenshot shots/02-five-seconds.png
          sleep 6
          xcrun simctl io "$DEVICE" screenshot shots/03-home.png
          xcrun simctl spawn "$DEVICE" log show --last 3m --predicate 'process == "NEXUSAI"' > shots/app.log || true
          ls -lh shots

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/maestro.zip https://github.com/mobile-dev-inc/maestro/releases/latest/download/maestro.zip
          unzip -q /tmp/maestro.zip -d /tmp/maestro
          echo "/tmp/maestro/maestro/bin" >> "$GITHUB_PATH"
          /tmp/maestro/maestro/bin/maestro --version

      - name: Native tap and navigation test
        run: |
          set -o pipefail
          maestro test .maestro/nexus-touch.yml --format junit --output shots/maestro.xml
          cp shots/maestro-01-settings.png shots/04-settings-tap.png
          cp shots/maestro-02-market-strong.png shots/05-market-strong.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexusAI-expo-screenshots
          path: shots
          if-no-files-found: warn

# capture last launch
