name: Build Expo iOS IPA

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/expo-ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expo-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.NEXUS_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      - name: Test app logic
        working-directory: mobile
        run: npm test

      - name: Generate native iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install --repo-update

      - name: Archive Release app
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace NEXUSAI.xcworkspace -scheme NEXUSAI \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/NexusAI.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" archive

      - name: Package and verify unsigned IPA
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          APP="build/NexusAI.xcarchive/Products/Applications/NEXUSAI.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          BIN="$APP/NEXUSAI"
          test -f "$BIN"
          file "$BIN"
          SIZE="$(stat -f%z "$BIN")"
          if [ "$SIZE" -lt 200000 ]; then
            echo "::error::App binary is only $SIZE bytes; this is not a compiled app"
            exit 1
          fi
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          test "$BUNDLE_ID" = "ai.nexus.app"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent build/Payload build/NEXUSAI-unsigned.ipa
          shasum -a 256 build/NEXUSAI-unsigned.ipa | tee build/NEXUSAI-unsigned.ipa.sha256
          echo "bundle=$BUNDLE_ID binary_bytes=$SIZE"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NEXUSAI-unsigned-ipa
          path: |
            mobile/ios/build/NEXUSAI-unsigned.ipa
            mobile/ios/build/NEXUSAI-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
