name: Build iOS App

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (simulator, compile check)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project NexusAI.xcodeproj -scheme NexusAI \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Archive (unsigned device build)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project NexusAI.xcodeproj -scheme NexusAI \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/NexusAI.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" archive

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/NexusAI.xcarchive/Products/Applications/NexusAI.app build/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/NexusAI-unsigned.ipa
          ls -lh build/NexusAI-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NexusAI-unsigned-ipa
          path: ios/build/NexusAI-unsigned.ipa
          if-no-files-found: error
